name: Build MJ Assistant APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          mkdir -p app/src/main/java/com/mj/assistant
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv MainActivity.kt app/src/main/java/com/mj/assistant/MainActivity.kt
          gradle build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: MJ_Assistant_APK
          path: app/build/outputs/apk/debug/*.apk
          
