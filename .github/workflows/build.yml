name: Build MJ Assistant APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto Fix Directory Paths
        run: |
          mkdir -p app/src/main/java/com/mj/assistant
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml app/src/main/AndroidManifest.xml; fi
          if [ -f MainActivity.kt ]; then mv MainActivity.kt app/src/main/java/com/mj/assistant/MainActivity.kt; fi

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: MJ_Assistant_APK
          path: app/build/outputs/apk/debug/*.apk
          
